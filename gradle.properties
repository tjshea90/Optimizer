# Build performance. The cloud sandbox has 4 cores / 16 GB; GitHub's runners have 4 cores / 16 GB.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true

# The shipped app deliberately uses NO AndroidX libraries (size, startup and RAM on a low-RAM Go device), so the flag stays off.
android.nonTransitiveRClass=true
kotlin.code.style=official
