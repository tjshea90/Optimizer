# Build, sign and release the Optimizer APK on GitHub's runners (the owner's rule across all his repos: "GitHub actions should do all the
# app compiling and apk making. Claude codes the app, GitHub makes the apk.").
#
# Dispatch with  full_build = true  to test, build, sign and verify.  Add  publish = true  to also make the GitHub Release (tag v<versionName>).
#   full_build = false  is a ~1 minute check that the gates still pass.
#   full_build = true, publish = false  builds and verifies, then keeps the APK as a workflow ARTIFACT for 14 days and publishes NOTHING
#   (the way to prove a CI change without burning a version number or creating a public Release).
# Claude dispatches it through the GitHub API (mcp__github__actions_run_trigger, run_workflow) after `bash ship.sh "note"`.
#
# MINUTES ARE THE SCARCE RESOURCE (tools/test_handoff.sh fails if either rule is undone):
#   1. NEVER add a `push:` branch trigger. autosave commits and pushes after every tool call; a push trigger would start a run every few
#      seconds. Tags and manual dispatch only.
#   2. Cheap gates first; a manual run does the gates only unless full_build is ticked. Tests, lint, build and publish share ONE job
#      (each extra job pays the JDK + Gradle + SDK setup again).
#
# SIGNING: every APK must carry the certificate pinned in signing/CERT_SHA256, because the tablet refuses an update signed by anything else.
#   - default: the PUBLIC dev key committed in signing/dev/ (see signing/README.md);
#   - if the repo secret SIGNING_KEYSTORE_BASE64 exists (with SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD) that private key signs
#     instead, and signing/CERT_SHA256 must then be re-pinned on purpose. tools/verify-apk.sh checks the ARTIFACT, not just the key that went in.
#
# GitHub creates the release tag itself (`gh release create --target`, in .github/scripts/publish-release.sh): a tag PUSH from the Claude sandbox is
# refused (403). This workflow COMMITS NOTHING (a workflow that pushed would retrigger the autosave machinery); tools/record-release.sh writes
# BUILDLOG.md after the run is green.
name: Build APK

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Test, build, sign and verify (a few minutes of Actions time). Leave OFF for a ~1 min check of the gates.'
        type: boolean
        default: false
      publish:
        description: 'Also publish the GitHub Release (tag v<versionName>). Leave OFF to keep the APK only as a 14-day workflow artifact.'
        type: boolean
        default: false
      note:
        description: 'What changed in this release (goes into the Release text)'
        type: string
        default: ''

permissions:
  contents: write

# A second dispatch for the same ref WAITS instead of cancelling a run that may be in the middle of publishing.
# (The build job below also holds a repo-wide lock, so two Claude sessions on different branches can never publish the same tag at once.)
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ seconds: decide the plan and run the cheap gates
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide how much of this run costs money
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full_build }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          full=false; publish=false
          if [ "$EVENT" = "push" ]; then
            full=true; publish=true            # a v<version> tag means a release was meant
          else
            [ "$FULL" = "true" ] && full=true
            [ "$full" = true ] && [ "$PUBLISH" = "true" ] && publish=true
          fi
          { echo "full=$full"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"
          if [ "$full" = true ] && [ "$publish" = true ]; then
            echo "FULL BUILD + PUBLISH (tests, lint, APK, signature check, GitHub Release)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$full" = true ]; then
            echo "FULL BUILD, NO RELEASE (tests, lint, APK, signature check; the APK is kept as a 14-day workflow artifact)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GATES ONLY. Re-run with **full_build** ticked (and **publish** for a Release) to build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gate - shell tooling self-test (save ladder, secret scan, workflow rules)
        run: bash tools/test_handoff.sh

      - name: Gate - the signing key is the pinned one
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"; PW="$STORE_PW"; AL="$KEY_ALIAS"; SRC="private key from the repo secrets"
          else
            KS=signing/dev/optimizer-dev.jks; PW=optimizer-dev; AL=optimizer-dev; SRC="public dev key (signing/dev)"
          fi
          GOT="$(keytool -list -v -keystore "$KS" -storepass "$PW" -alias "$AL" 2>/dev/null | sed -n 's/.*SHA256: *//p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          WANT="$(tr -d ' \r\n' < signing/CERT_SHA256)"
          rm -f "$RUNNER_TEMP/release.jks"
          if [ -z "$GOT" ] || [ "$GOT" != "$WANT" ]; then
            echo "::error::The signing key ($SRC) does not have the pinned certificate. expected $WANT got ${GOT:-unreadable}. An APK signed with it would NOT update the tablet in place."
            exit 1
          fi
          echo "Signing with the $SRC; certificate $WANT matches the pin." >> "$GITHUB_STEP_SUMMARY"

      - name: Gate - versionCode is not a downgrade
        run: |
          . tools/appinfo.sh
          VC="$(app_vcode)"; PREV="$(app_last_code)"
          echo "$(app_title) $(app_vname) versionCode $VC, highest shipped $PREV"
          if [ "$VC" -lt "$PREV" ]; then
            echo "::error::versionCode $VC is LOWER than the highest shipped ($PREV): Android refuses a downgrade."
            exit 1
          fi
          # An EQUAL code is a rebuild of the current release (allowed: same certificate => in-place reinstall). ship.sh, which publishes
          # a NEW release, enforces the stricter "higher".

  # ------------------------------------------------------------------ minutes: tests + lint + build + verify + (publish)
  build:
    needs: check
    if: needs.check.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # one build/publish at a time across ALL branches
    concurrency:
      group: release-build
      cancel-in-progress: false
    env:
      PUBLISH: ${{ needs.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-build

      - name: Private signing key (only when the repo secret exists)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            { echo "storeFile=$RUNNER_TEMP/release.jks"; echo "storePassword=$STORE_PW"; echo "keyAlias=$KEY_ALIAS"; echo "keyPassword=$KEY_PW"; } > keystore.properties
          fi

      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease --console=plain

      - name: Build the release APK (R8, signed)
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify the APK itself (certificate pin, package, version, no GMS, size)
        run: bash tools/verify-apk.sh

      - name: Publish the Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
        run: bash .github/scripts/publish-release.sh

      - name: Keep the APK as a workflow artifact (no Release was made)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Keep the APK for inspection (failed runs only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove the signing material from the workspace
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
